name: Publicar versão web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx expo export --platform web --output-dir dist

      # GitHub Pages has no server-side rewrite rules, and the Nutritri app
      # is a client-side single-page app (Expo Router in "single" web output
      # mode): a direct/refreshed visit to a route like /day/1 has no
      # matching file. Serving index.html for any unmatched path lets
      # Expo Router's client-side router take over from the real URL.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
